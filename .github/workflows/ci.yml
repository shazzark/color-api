name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- openapi.json
      - run: npm run openapi:check
      - run: npm run package:types
      - run: npm run package:smoke
      - run: npm run package:stage
      - run: npm run package:contents
      - run: npm run package:tarball-smoke
      - run: npm run release:stage
      - run: npm run release:smoke
      - run: npm run container:smoke

  web-verify:
    name: Website (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Typecheck website
        working-directory: web
        run: npm run typecheck
      - name: Lint website
        working-directory: web
        run: npm run lint
      - name: Build and run Chromium tests
        working-directory: web
        env:
          NEXT_PUBLIC_CHROMAFORGE_API_ORIGIN: https://color-api-9qdz.onrender.com
        run: npm test
